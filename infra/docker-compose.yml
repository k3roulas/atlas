services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7
    ports:
      - '6379:6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgis/postgis:16-3.4
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: atlas_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpitdata:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readycheck']
      interval: 5s
      timeout: 5s
      retries: 5

  photon:
    image: rtuszik/photon-docker:latest
    ports:
      - '2322:2322'
    environment:
      REGION: france
    volumes:
      - photondata:/photon/photon_data

  martin:
    image: maplibre/martin
    platform: linux/amd64
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/atlas
    depends_on:
      postgres:
        condition: service_healthy

caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      martin:
        condition: service_started

volumes:
  pgdata:
  valkeydata:
  photondata:
  mailpitdata:
